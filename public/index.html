<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community Copilot Assistant</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
        background: #f3f4f6;
        color: #111827;
      }
      .app {
        max-width: 780px;
        margin: 40px auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }
      .header {
        padding: 20px;
        background: #111827;
        color: #f9fafb;
      }
      .header h1 {
        margin: 0;
        font-size: 1.25rem;
      }
      .header p {
        margin: 6px 0 0;
        opacity: 0.85;
      }
      .messages {
        height: 420px;
        overflow-y: auto;
        padding: 18px;
        background: #f9fafb;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .message {
        padding: 12px 14px;
        border-radius: 10px;
        max-width: 85%;
        line-height: 1.35;
      }
      .message.user {
        margin-left: auto;
        background: #2563eb;
        color: #fff;
      }
      .message.bot {
        margin-right: auto;
        background: #e5e7eb;
      }
      .composer {
        display: flex;
        gap: 10px;
        padding: 16px;
        border-top: 1px solid #e5e7eb;
      }
      .composer input {
        flex: 1;
        padding: 11px 12px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        font-size: 0.95rem;
      }
      .composer button {
        background: #111827;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 0 16px;
        cursor: pointer;
      }
      .composer button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="header">
        <h1>Community Copilot AI Assistant</h1>
        <p>Ask community questions and get instant guidance.</p>
      </section>
      <section id="messages" class="messages" aria-live="polite"></section>
      <form id="chat-form" class="composer">
        <input
          id="message-input"
          type="text"
          placeholder="Ask about events, support, guidelines..."
          autocomplete="off"
          required
        />
        <button id="send-button" type="submit">Send</button>
      </form>
    </main>

    <script>
      const form = document.getElementById('chat-form');
      const input = document.getElementById('message-input');
      const sendButton = document.getElementById('send-button');
      const messages = document.getElementById('messages');

      function addMessage(role, text) {
        const el = document.createElement('div');
        el.className = `message ${role}`;
        el.textContent = text;
        messages.appendChild(el);
        messages.scrollTop = messages.scrollHeight;
      }

      addMessage('bot', 'Hi! I am your Community Copilot. How can I help today?');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        addMessage('user', text);
        input.value = '';
        sendButton.disabled = true;

        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || 'Unable to get response');
          }

          addMessage('bot', data.answer);
        } catch (error) {
          addMessage('bot', `Sorry, something went wrong: ${error.message}`);
        } finally {
          sendButton.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
