[project]
name = "community-copilot"
version = "0.1.0"
description = "Local-first AI Discord assistant for technical communities (summaries, issue tracking, knowledge base)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "live_ollama: requires a running local Ollama server with the configured model (opt-in, set RUN_LIVE_OLLAMA=1)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
ignore = [
    # Keep `(str, Enum)` instead of StrEnum: it preserves the exact str()
    # formatting used across embeds and tests ("IssueStatus.unresolved").
    "UP042",
]
